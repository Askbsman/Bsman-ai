openapi: 3.1.0
info:
  title: BS Man Risk API
  version: 0.1.0
  description: Conversation Risk Intelligence API for AI agents.
  x-bazaar-metadata:
    name: Call BS Man API
    provider: BS Man AI
    category: Security
    resourceUrl: https://api.callbsman.com/v1/analyze
    docsUrl: https://callbsman.com
    githubUrl: https://github.com/Askbsman/Bsman-ai
    cdpIndexingLimitation: BS Man AI exposes Bazaar-compatible metadata for x402 discovery. Official Coinbase Bazaar auto-indexing may require CDP Facilitator settlement. The current production endpoint uses xpay facilitator on Base mainnet because CDP onboarding is not available in the current setup.
servers:
  - url: https://api.callbsman.com
    description: Primary production API
  - url: https://bsman-ai.onrender.com
    description: Render fallback endpoint
  - url: http://localhost:3000
    description: Local development
paths:
  /:
    get:
      summary: Service metadata
      operationId: getServiceMetadata
      responses:
        "200":
          description: Public service metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceMetadata"
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service health status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /docs/openapi.yaml:
    get:
      summary: OpenAPI YAML
      operationId: getDocsOpenApiYaml
      responses:
        "200":
          description: OpenAPI document in YAML format.
          content:
            text/yaml:
              schema:
                type: string
  /openapi.yaml:
    get:
      summary: OpenAPI YAML
      operationId: getOpenApiYaml
      responses:
        "200":
          description: OpenAPI document in YAML format.
          content:
            text/yaml:
              schema:
                type: string
  /docs/openapi.json:
    get:
      summary: OpenAPI JSON
      operationId: getDocsOpenApiJson
      responses:
        "200":
          description: OpenAPI document in JSON format.
          content:
            application/json:
              schema:
                type: object
  /openapi.json:
    get:
      summary: OpenAPI JSON
      operationId: getOpenApiJson
      responses:
        "200":
          description: OpenAPI document in JSON format.
          content:
            application/json:
              schema:
                type: object
  /v1/analyze:
    get:
      summary: Paid x402 discovery/capability probe
      operationId: getAnalyzeCapability
      x-x402:
        payment: x402
        network: Base mainnet
        price: "$0.001"
        resource: https://api.callbsman.com/v1/analyze
        fallback: https://bsman-ai.onrender.com/v1/analyze
        mimeType: application/json
        mainMode: agent_action_check
        bazaarMetadata: docs/bazaar-metadata.json
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: "0.001000"
        protocols:
          - x402: {}
      responses:
        "200":
          description: Capability JSON after verified x402 payment.
          content:
            application/json:
              schema:
                type: object
        "402":
          description: Payment Required
          headers:
            PAYMENT-REQUIRED:
              description: Base64url encoded x402 PaymentRequired payload.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
    post:
      summary: Analyze communication risk signals
      operationId: analyzeConversationRisk
      x-x402:
        payment: x402
        network: Base mainnet
        price: "$0.001"
        resource: https://api.callbsman.com/v1/analyze
        fallback: https://bsman-ai.onrender.com/v1/analyze
        mimeType: application/json
        mainMode: agent_action_check
        bazaarMetadata: docs/bazaar-metadata.json
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: "0.001000"
        protocols:
          - x402: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeRequest"
            examples:
              scamCheck:
                value:
                  mode: scam_check
                  language: en
                  input: Your wallet is suspended. Click this urgent link and enter your seed phrase.
              safeReply:
                value:
                  mode: safe_reply
                  language: en
                  input: Send the deposit now and do not tell anyone. This deal expires in one hour.
                  options:
                    tone: calm_firm
              agentActionCheck:
                value:
                  mode: agent_action_check
                  language: en
                  input: This crypto investment guarantees 20% weekly returns. Send crypto today to secure your allocation.
                  proposed_action: send_payment
                  asset: USDC
                  amount: "100"
                  recipient_type: unknown_wallet
                  channel: Telegram
                  verification_status: unverified
                  sensitive_data_involved: false
      responses:
        "200":
          description: Structured communication risk analysis.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeResponse"
        "400":
          description: Validation or unsupported-language error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: Payment Required
          content:
            application/json:
              schema:
                type: object
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    ServiceMetadata:
      type: object
      required:
        - name
        - service
        - description
        - version
        - endpoints
        - resources
      properties:
        name:
          type: string
          const: BS Man AI
        service:
          type: string
          const: Call BS Man API
        description:
          type: string
          const: Conversation Risk Intelligence API for AI agents.
        version:
          type: string
        docs:
          type: string
        openapi:
          type: string
        endpoints:
          type: object
          required:
            - health
            - analyze
            - openapi
          properties:
            health:
              type: string
            analyze:
              type: string
            analyze_probe:
              type: string
            openapi:
              type: string
            openapi_json:
              type: string
            openapi_yaml:
              type: string
        resources:
          type: array
          items:
            type: object
            required:
              - name
              - url
              - methods
              - payment
            properties:
              name:
                type: string
              url:
                type: string
              path:
                type: string
              methods:
                type: array
                items:
                  type: string
              primary_method:
                type: string
              payment:
                type: object
        sample_endpoints:
          type: array
          items:
            type: object
    HealthResponse:
      type: object
      required:
        - ok
        - service
        - version
      properties:
        ok:
          type: boolean
          const: true
        service:
          type: string
          const: bsman-risk-api
        version:
          type: string
    AnalyzeRequest:
      type: object
      required:
        - mode
      properties:
        mode:
          type: string
          enum:
            - scam_check
            - dialogue_check
            - offer_check
            - manipulation_check
            - safe_reply
            - agent_action_check
        language:
          type: string
          description: Language code. BS Man AI v0.1 supports only en.
          default: en
        locale:
          type: string
          description: Future locale hint. Accepted for forward compatibility but not used for scoring in v0.1.
        proposed_action:
          type: string
          enum:
            - send_payment
            - share_credentials
            - share_seed_phrase
            - connect_wallet
            - sign_transaction
            - click_link
            - download_file
            - share_sensitive_data
            - approve_transfer
            - call_external_tool
          description: Proposed action for agent_action_check mode.
        asset:
          type: string
        amount:
          oneOf:
            - type: string
            - type: number
        recipient_type:
          type: string
        channel:
          type: string
        verification_status:
          type: string
        sensitive_data_involved:
          type: boolean
        input:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 12000
            - type: object
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 12000
                conversation:
                  type: array
                  items:
                    type: object
                    required:
                      - content
                    properties:
                      role:
                        type: string
                      content:
                        type: string
                context:
                  $ref: "#/components/schemas/AgentActionContext"
          description: Either English text or an agent-friendly object with text, conversation, and context.
        context:
          $ref: "#/components/schemas/AgentActionContext"
        conversation:
          type: array
          description: Optional multi-message conversation. When present, all message content is analyzed together.
          minItems: 1
          maxItems: 40
          items:
            type: object
            required:
              - content
            properties:
              role:
                type: string
                maxLength: 60
              content:
                type: string
                minLength: 1
                maxLength: 4000
        options:
          type: object
          properties:
            tone:
              type: string
              enum:
                - calm_firm
                - polite
                - direct
                - neutral
              description: Safe reply tone. Defaults to calm_firm.
            include_safe_reply:
              type: boolean
              description: Discovery hint for clients. The v0.1 API returns safe_reply for safe_reply mode and null otherwise.
            include_detected_patterns:
              type: boolean
              description: Discovery hint for clients. The v0.1 API always returns detected_patterns.
            risk_detail_level:
              type: string
              enum:
                - standard
              description: Discovery hint for clients. The v0.1 API uses standard deterministic detail.
    DetectedPattern:
      type: object
      required:
        - id
        - name
        - category
        - weight
        - matched_phrases
        - confidence
        - evidence_snippet
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
        weight:
          type: integer
          minimum: 0
          maximum: 100
        matched_phrases:
          type: array
          items:
            type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        evidence_snippet:
          type: string
          maxLength: 160
    AnalyzeResponse:
      type: object
      required:
        - mode
        - risk_score
        - risk_level
        - summary
        - detected_patterns
        - red_flags
        - recommended_action
        - safe_reply
        - disclaimer
      properties:
        mode:
          type: string
          enum:
            - scam_check
            - dialogue_check
            - offer_check
            - manipulation_check
            - safe_reply
            - agent_action_check
        risk_score:
          type: integer
          minimum: 0
          maximum: 100
        risk_level:
          type: string
          enum:
            - low
            - medium
            - high
            - critical
        summary:
          type: string
        detected_patterns:
          type: array
          items:
            $ref: "#/components/schemas/DetectedPattern"
        red_flags:
          type: array
          items:
            type: string
        recommended_action:
          type: string
        safe_reply:
          type:
            - string
            - "null"
        disclaimer:
          type: string
        verdict:
          type: string
          enum:
            - proceed
            - proceed_with_caution
            - pause_and_verify
            - require_human_review
            - do_not_proceed
        requires_human_review:
          type: boolean
        next_best_action:
          type: string
        action_risk_reasons:
          type: array
          items:
            type: string
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - details
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - UNSUPPORTED_LANGUAGE
                - INTERNAL_ERROR
                - X402_CONFIG_ERROR
                - X402_RUNTIME_ERROR
            message:
              type: string
            details:
              oneOf:
                - type: array
                  items: {}
                - type: object
    AgentActionContext:
      type: object
      properties:
        proposed_action:
          type: string
          enum:
            - send_payment
            - share_credentials
            - share_seed_phrase
            - connect_wallet
            - sign_transaction
            - click_link
            - download_file
            - share_sensitive_data
            - approve_transfer
            - call_external_tool
        asset:
          type: string
        amount:
          oneOf:
            - type: string
            - type: number
        recipient_type:
          type: string
        channel:
          type: string
        verification_status:
          type: string
        sensitive_data_involved:
          type: boolean
